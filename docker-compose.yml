version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
      POSTGRES_DB: birthday_surprise
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birthday"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://birthday:birthday@postgres:5432/birthday_surprise
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 80
      BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
